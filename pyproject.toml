[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vtu-hc-quantum-arise"
version = "0.1.0"
description = "QuantumPulse: heartbeat-based quantum circuit integrity monitoring and gate-tampering localisation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "qiskit>=1.0.0",
    "qiskit-aer>=0.14.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
# The monitoring pipeline runs without these; they are only needed for the
# dashboard and the optional ML comparison.
dashboard = [
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "pandas>=2.0.0",
]
ml = [
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
quantumpulse = "quantumpulse.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["quantumpulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning:qiskit_aer.*",
]
